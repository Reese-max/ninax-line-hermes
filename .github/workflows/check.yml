name: NINAX checks
on:
  push:
  pull_request:
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Offline checks with a commit-bound receipt
        run: python -B video-loop/check_ci.py offline --out "$RUNNER_TEMP/offline.json"
  pipeline-windows:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install locked pipeline dependencies
        run: |
          python -c "import json,subprocess; p=json.load(open('video-loop/runtime-lock.json'))['environments']['pipeline']['packages']; subprocess.run(['python','-m','pip','install',*[f'{k}=={v}' for k,v in p.items() if k!='pip']],check=True)"
      - name: Native Windows pipeline self-check
        run: python -B video-loop/check_ci.py pipeline-windows --out "$env:RUNNER_TEMP/pipeline-windows.json"
  hermes-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Install native media fixture prerequisites
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes ffmpeg
          ffmpeg -hide_banner -version
          ffprobe -hide_banner -version
      - name: Restore pinned Hermes source and dependencies
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, subprocess
          lock=json.loads(pathlib.Path('video-loop/runtime-lock.json').read_text())
          root=pathlib.Path(os.environ['RUNNER_TEMP'])/'ninax-hermes'
          for cmd in (['git','init',str(root)],['git','-C',str(root),'remote','add','origin',lock['hermes']['repository']],
                      ['git','-C',str(root),'fetch','--depth','1','origin',lock['hermes']['commit']],
                      ['git','-C',str(root),'checkout','--detach','FETCH_HEAD']):
              subprocess.run(cmd,check=True)
          requirements=root/'ninax-requirements.txt'
          requirements.write_text('\n'.join(k+'=='+v for k,v in lock['environments']['hermes']['packages'].items() if k!='hermes-agent')+'\npytest==9.1.1\npytest-asyncio==1.3.0\n')
          subprocess.run(['python','-m','pip','install','-r',str(requirements)],check=True)
          subprocess.run(['python','-m','pip','install','--no-deps','-e',str(root)],check=True)
          (root/'gateway/run_turn_runner.py').write_bytes(pathlib.Path('video-loop/work/hermes/gateway/run_turn_runner.py').read_bytes())
          PY
      - name: Source and delivery guards against native Hermes
        shell: bash
        run: python -B video-loop/check_ci.py hermes-contract --hermes "$RUNNER_TEMP/ninax-hermes" --out "$RUNNER_TEMP/hermes-contract.json"
      - name: Report bounded native check details
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib
          receipt=pathlib.Path(os.environ['RUNNER_TEMP'])/'hermes-contract.json'
          if receipt.is_file():
              result=json.loads(receipt.read_text())
              for check in result.get('checks', []):
                  print(json.dumps(check, ensure_ascii=False))
          PY
